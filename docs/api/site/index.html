<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API Reference — Tamga Network</title>
    <meta name="description" content="Tamga Network API reference: hosted issuing API, hosted verifier API and the institution lookup endpoint (OpenAPI 3.1)." />
    <link rel="icon" href="https://tamga.network/favicon.ico" />
    <style>
      /* Tamga marka renkleri (Al Kızıl, Altın, Obsidyen, Parşömen) */
      :root {
        --scalar-font: "IBM Plex Sans", -apple-system, "Segoe UI", sans-serif;
        --scalar-font-code: "IBM Plex Mono", ui-monospace, monospace;
      }
      .light-mode {
        --scalar-color-accent: #b01e22;
        --scalar-background-1: #ffffff;
        --scalar-background-2: #f6f1e8;
        --scalar-background-3: #efe6d5;
        --scalar-color-1: #17110f;
      }
      .dark-mode {
        --scalar-color-accent: #e0554b;
        --scalar-background-1: #151313;
        --scalar-background-2: #1d1b1b;
        --scalar-background-3: #262323;
        --scalar-color-1: #f4ede2;
      }
      .tamga-bar {
        display: flex; align-items: center; gap: 16px; padding: 10px 20px; font: 500 13px/1 var(--scalar-font);
        border-bottom: 1px solid rgba(128, 128, 128, 0.2); background: #17110f; color: #f4ede2;
      }
      .tamga-bar a { color: inherit; text-decoration: none; opacity: 0.8; }
      .tamga-bar a:hover { opacity: 1; }
      .tamga-bar b { color: #c8a24c; letter-spacing: 0.08em; }
      .tamga-bar .sp { flex: 1; }
    </style>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" />
  </head>
  <body>
    <div class="tamga-bar">
      <a href="https://tamga.network"><b>TAMGA</b></a>
      <span>API Reference</span>
      <span class="sp"></span>
      <a href="https://docs.tamga.network">Developers</a>
      <a href="https://tamga.network/en/sdk">SDK</a>
      <a href="https://github.com/tamga-network">GitHub</a>
    </div>
    <div id="app"></div>
    <script src="./scalar.js"></script>
    <script>
      Scalar.createApiReference("#app", {
        sources: [
          { title: "Hosted Issuer API", slug: "issuer", url: "./tamga-issuer-api.openapi.yaml" },
          { title: "Hosted Verifier API", slug: "verifier", url: "./hosted-verifier-api.openapi.yaml" },
          { title: "Institution lookup endpoint", slug: "institution-source", url: "./institution-source.openapi.yaml" },
        ],
        layout: "modern",
        theme: "none",
        hideClientButton: false,
        withDefaultFonts: false,
        telemetry: false,
        showDeveloperTools: "never",
        agent: { disabled: true },
        mcp: { disabled: true },
      });
    </script>
  </body>
</html>
