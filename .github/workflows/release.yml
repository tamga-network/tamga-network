# @tamga-network/* npm yayını — YALNIZCA elle başlatılır (Actions → release → Run workflow). Proje yönetiminin onayı olmadan çalıştırılmaz.
# Sürüm: paketler 0.x deneme sürümleriyle yayımlanır (bugün 0.2.0; kararlı 1.0.0 hazır olunca). Dağıtım etiketi npm'in varsayılanı
# `latest` kalır: `npm install @tamga-network/core` en son deneme sürümünü kurar (0.x'te `next` etiketi gerekmez).
# Kimlik: npm Trusted Publishing (OIDC) — her paketin npmjs.com ayarlarında Trusted Publisher = GitHub Actions, bu depo
# (tamga-network/tamga-network), iş akışı `release.yml`, ortam `npm`. Uzun ömürlü token yok (ARCH-0005 P2). Trusted Publishing
# npm CLI >= 11.5.1 ister (Node 22'nin npm'i 10.x) → aşağıda npm güncellenir. Trusted Publisher yalnız npm'de VAR OLAN pakete
# tanımlanabilir: yeni bir paketin (bugün @tamga-network/zk) ilk yayını proje yönetimince elle, 2FA ile yapılır (adımlar iç
# teslimat notunda); sonra Trusted Publisher tanımlanır ve sonraki sürümler bu iş akışından çıkar.
# Sürümler önceden commit'lenmiş olmalı. Provenance: npm, paketin bu depodaki bu commit'ten GitHub Actions ile üretildiğini
# imzalı olarak kaydeder (ARCH-0005 P2/P3).
# @tamga-network/zk (ADR-0032): telefon ispatçısının derlenmiş Android kütüphaneleri (jniLibs/{arm64-v8a,armeabi-v7a,x86_64}/
# libtamga_zk_prover.so) depoda yoktur ve çalıştırıcıda NDK yoktur: sağlama adımı eklenene kadar zk bu iş akışından yayınlanamaz
# — aşağıdaki denetim bunu açıkça söyler; diğer paketler `packages` girdisiyle zk olmadan yayınlanır:
#   packages = "core mdoc schemas sd-jwt trust issuer verifier wallet-core". iOS xcframework yoksa zk paketi yalnız Android'dir.
name: release
on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Yayınlanacak paketler (boşluklu; boş = hepsi). Ör: core trust verifier"
        required: false
        default: ""
      dry_run:
        description: "Yalnızca prova (npm publish --dry-run)"
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write # npm provenance + trusted publishing (OIDC)
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm # GitHub ortam koruması: onaylayıcı proje yönetimi
    env:
      TAMGA_REQUIRE_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm CLI (Trusted Publishing için >= 11.5.1)
        run: npm install -g npm@11 --no-audit --no-fund && npm --version
      - run: npm ci --no-audit --no-fund
      - run: npm run pki && npm run schemas:build && npm run trust:build && npm run trust:build && npm run trust:heartbeat && npm run trust:test-fixtures
      - run: npm test && npm run typecheck
      - name: Paket seçimi + zk yerel kütüphaneleri
        env:
          PACKAGES: ${{ inputs.packages }} # girdi kabuğa doğrudan gömülmez (betik enjeksiyonu): ortamdan, tırnaklı
        run: |
          set -euo pipefail
          if ! [[ "$PACKAGES" =~ ^[a-z0-9\ -]*$ ]]; then echo "::error::packages yalnız paket adları içerebilir"; exit 1; fi
          echo "TAMGA_PACK_PACKAGES=$PACKAGES" >> "$GITHUB_ENV"
          if [ -z "$PACKAGES" ] || echo " $PACKAGES " | grep -q " zk "; then
            for abi in arm64-v8a armeabi-v7a x86_64; do
              f="packages/zk/android/src/main/jniLibs/$abi/libtamga_zk_prover.so"
              if [ ! -f "$f" ]; then
                echo "::error::$f yok — zk yayını için Android kütüphaneleri önceden derlenip (node packages/zk/scripts/build-android.mjs) sağlanmalı; ya da packages girdisinde zk'yı çıkarın"
                exit 1
              fi
            done
          fi
      - run: npm run release:check
      - name: npm publish (.publish/<paket>)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # Trusted Publishing (OIDC) kuruluysa sır tanımlanmaz, boş kalır
          PACKAGES: ${{ inputs.packages }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          SEL="$PACKAGES"
          DRY=""; [ "$DRY_RUN" = "true" ] && DRY="--dry-run"
          for dir in .publish/*/; do
            p=$(basename "$dir"); [ "$p" = "tarballs" ] && continue
            if [ -n "$SEL" ] && ! echo " $SEL " | grep -q " $p "; then continue; fi
            name=$(node -p "require('./$dir/package.json').name"); ver=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then echo "↷ $name@$ver zaten yayında, atlanıyor"; continue; fi
            (cd "$dir" && npm publish --provenance --access public $DRY)
          done
