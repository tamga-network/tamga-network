# @tamga-network/* npm release — started manually only (Actions → release → Run workflow), with project management approval.
# Versions: the packages are published as 0.x test releases (today 0.4.0; stable 1.0.0 when ready) under npm's default `latest`
# tag. Versions must be committed beforehand.
# Identity: npm Trusted Publishing (OIDC) — no long-lived token. Each package's Trusted Publisher on npmjs.com is GitHub
# Actions, this repository, workflow `release.yml`, environment `npm`. Trusted Publishing needs npm CLI >= 11.5.1 (Node 22
# ships npm 10), so npm is upgraded below. A Trusted Publisher can only be set on a package that already exists on npm: a new
# package's first release is made by hand with 2FA. Provenance records that each package was built from this commit by
# GitHub Actions.
# @tamga-network/zk: the phone prover's Android libraries (jniLibs/{arm64-v8a,armeabi-v7a,x86_64}/libtamga_zk_prover.so) are
# not in the repository and the runner has no NDK, so zk cannot be released from this workflow until a provisioning step is
# added — the check below says so. Release the other packages without zk via the `packages` input:
#   packages = "core mdoc schemas sd-jwt trust issuer verifier wallet-core". Without an iOS xcframework zk is Android-only.
name: release
on:
  workflow_dispatch:
    inputs:
      packages:
        description: "Packages to publish (space separated; empty = all). E.g.: core trust verifier"
        required: false
        default: ""
      dry_run:
        description: "Dry run only (npm publish --dry-run)"
        type: boolean
        default: true
permissions:
  contents: read
  id-token: write # npm provenance + trusted publishing (OIDC)
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm # GitHub environment protection: approved by project management
    env:
      TAMGA_REQUIRE_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: npm CLI (>= 11.5.1 for Trusted Publishing)
        run: npm install -g npm@11 --no-audit --no-fund && npm --version
      - run: npm ci --no-audit --no-fund
      - run: npm run setup # same preparation as ci.yml (including sandbox PKI and lists; test prerequisites)
      - run: npm test && npm run typecheck
      - name: Package selection + zk native libraries
        env:
          PACKAGES: ${{ inputs.packages }} # passed through the environment, quoted (no script injection)
        run: |
          set -euo pipefail
          if ! [[ "$PACKAGES" =~ ^[a-z0-9\ -]*$ ]]; then echo "::error::packages may only contain package names"; exit 1; fi
          echo "TAMGA_PACK_PACKAGES=$PACKAGES" >> "$GITHUB_ENV"
          if [ -z "$PACKAGES" ] || echo " $PACKAGES " | grep -q " zk "; then
            for abi in arm64-v8a armeabi-v7a x86_64; do
              f="packages/zk/android/src/main/jniLibs/$abi/libtamga_zk_prover.so"
              if [ ! -f "$f" ]; then
                echo "::error::$f is missing — build the Android libraries first (node packages/zk/scripts/build-android.mjs) or leave zk out of the packages input"
                exit 1
              fi
            done
          fi
      - run: npm run release:check
      - name: npm publish (.publish/<package>)
        env:
          PACKAGES: ${{ inputs.packages }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          SEL="$PACKAGES"
          DRY=""; [ "$DRY_RUN" = "true" ] && DRY="--dry-run"
          for dir in .publish/*/; do
            p=$(basename "$dir"); [ "$p" = "tarballs" ] && continue
            if [ -n "$SEL" ] && ! echo " $SEL " | grep -q " $p "; then continue; fi
            name=$(node -p "require('./$dir/package.json').name"); ver=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then echo "↷ $name@$ver already published, skipping"; continue; fi
            (cd "$dir" && npm publish --provenance --access public $DRY)
          done
