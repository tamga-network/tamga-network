# tamga-network CI — on every push to main and every pull request.
# Missing prerequisites fail instead of being skipped silently (TAMGA_REQUIRE_FIXTURES=1).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAMGA_REQUIRE_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # development PKI + schema catalogue + trust lists (temporary; CI keys are never published).
      # The trust list is built twice: the rollback test needs an older, validly signed version.
      - run: npm run setup
      - run: npm test
      - run: npm run typecheck
      - run: npm run format:check
      - run: node scripts/sync-invariants.mjs --check
      # internal document index: present only in the development repository
      - run: if [ -f scripts/master-index.mjs ]; then node scripts/master-index.mjs --check; fi
      - run: npm run arf:check
      - run: npm run docs:check
      # @tamga-network/zk is left out: its compiled Android libraries are not in the repository (see release.yml)
      - name: release preparation + smoke test (no npm publish)
        env:
          TAMGA_PACK_PACKAGES: core mdoc schemas sd-jwt trust issuer verifier wallet-core
        run: npm run release:check
  # Trust-layer contracts (SPEC-BC-0001): compile + unit tests on an in-process chain. The contracts folder exists only in the
  # development repository (no production chain yet, ADR-0009 K4); the job is skipped where it is absent.
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: contracts present?
        id: present
        run: if [ -f contracts/package.json ]; then echo "yes=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.present.outputs.yes == '1'
        run: npm run contracts:install
      - if: steps.present.outputs.yes == '1'
        run: npm run contracts:compile
      - if: steps.present.outputs.yes == '1'
        run: npm run contracts:test
      - if: steps.present.outputs.yes == '1'
        run: npm run contracts:check
