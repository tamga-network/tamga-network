# tamga-network CI — her push / PR'da. Uzak depo (github.com/tamga-network/tamga-network) açılınca etkinleşir.
# Kurallar: CONVENTIONS.md §4 (ön koşul eksikse sessiz atlama yok: TAMGA_REQUIRE_FIXTURES=1), §5.
name: ci
on:
  push:
    branches: [main, "claude-setup", "feat/**", "fix/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAMGA_REQUIRE_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      # dev PKI + şema kataloğu + güven listeleri (geçici; CI anahtarları hiçbir yere yayınlanmaz)
      # setup: güven listesi iki kez derlenir — geri sarma testi eski (imzası geçerli) bir sürüm ister
      - run: npm run setup
      - run: npm test
      - run: npm run typecheck
      - run: npm run format:check
      - run: node scripts/sync-invariants.mjs --check
      - run: node scripts/master-index.mjs --check
      - run: npm run arf:check
      - run: npm run docs:check
      - name: yayın hazırlığı + duman testi (npm'e yayın YOK)
        run: npm run release:check
