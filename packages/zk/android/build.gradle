// @tamga-network/zk — Expo modülü (Android). Rust kütüphanesi `src/main/jniLibs/<abi>/libtamga_zk_prover.so` olarak gelir
// (packages/zk/scripts/build-android.mjs; depoya girmez, paket yayınında dahil edilir).
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'network.tamga'
version = '1.0.0'

android {
  namespace "network.tamga.zk"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
    ndk {
      abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
    }
  }
}
