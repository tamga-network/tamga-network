# Longfellow çalışma zamanının `zstd` (C kütüphanesi) bağımlılığının WASM için saf Rust karşılığı.
# Yalnız doğrulayıcının kullandığı yüzey: `zstd::stream::read::Decoder` (devre dosyasını açmak) ve `zstd::encode_all`
# (devre ÜRETİMİ — doğrulayıcıda çağrılmaz; hata döner). Çözücü: ruzstd (saf Rust, MIT).
[package]
name = "zstd"
version = "0.13.99"
edition = "2021"
publish = false
license = "Apache-2.0"

[dependencies]
ruzstd = { version = "0.8", default-features = false, features = ["std"] }
