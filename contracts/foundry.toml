[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
evm_version = "shanghai"        # Besu QBFT ile uyumlu; cancun'a geçmeden Besu sürümünü doğrula
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"          # deterministik derleme
cbor_metadata = false
ffi = false

# Yükseltilebilirlik denetimi için depolama düzeni çıktısı
extra_output = ["storageLayout"]

[profile.ci]
verbosity = 3
fuzz = { runs = 1000 }

[profile.lite]
optimizer = false

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[lint]
exclude_lints = []
