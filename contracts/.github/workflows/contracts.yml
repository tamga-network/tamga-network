name: contracts

on:
  push:
    paths: ["contracts/**"]
  pull_request:
    paths: ["contracts/**"]

defaults:
  run:
    working-directory: contracts

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {submodules: recursive}

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Bağımlılıklar
        run: make install

      - name: Derle
        run: forge build --sizes

      - name: Biçim kontrolü
        run: forge fmt --check

      - name: Testler
        run: forge test -vvv
        env: {FOUNDRY_PROFILE: ci}

      # SPEC-BC-0001 §9 — atlanamaz
      - name: UUPS brick koruması
        run: bash script/check-upgrade-safety.sh

      - name: Depolama düzeni farkı
        run: |
          git diff --exit-code .storage/ || {
            echo "::error::Depolama düzeni değişti. SPEC-BC-0001 §9: mevcut slot'lar asla değişmez."
            exit 1
          }

      - name: Gas raporu
        run: forge test --gas-report > gas-report.txt || true

      - uses: actions/upload-artifact@v4
        with: {name: gas-report, path: contracts/gas-report.txt}

  static-analysis:
    runs-on: ubuntu-latest
    continue-on-error: true   # bulgular bilgilendirici; merge'i bloklamaz
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: make install
      - uses: crytic/slither-action@v0
        with:
          target: contracts/
          slither-args: --exclude-dependencies
