# Deney (üretimde kullanılmaz): Longfellow mdoc_zk çalışma zamanı etrafında küçük bir komut satırı aracı.
[package]
name = "tamga-zk"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
mdoc-zk-runtime = { path = "../vendor/longfellow-zk/rust/applications/mdoc_zk/runtime" }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
